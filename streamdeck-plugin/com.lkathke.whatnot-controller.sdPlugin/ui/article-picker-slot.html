<!DOCTYPE html>
<html>

<head lang="en">
    <title>Article Picker Slot Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Slot Index">
        <sdpi-textfield setting="slot" placeholder="0-based, e.g. 0, 1, 2 ..." default="0"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label=" ">
        <span>
            Platziere mehrere dieser Tasten auf einer Seite mit fortlaufenden Slot-Indizes (0, 1, 2, ...),
            dazu ein oder zwei "Article Picker Nav"-Tasten zum Blättern. Titel und (wenn auflösbar) Produktbild
            werden automatisch aus den aktuellen Live-Listings befüllt.
        </span>
    </sdpi-item>
</body>

</html>
