<!DOCTYPE html>
<html>

<head lang="en">
    <title>Set Start Price Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <!--
        Learn more about property inspector components at https://sdpi-components.dev/docs/components
    -->
    <sdpi-item label="Start Price">
        <sdpi-textfield setting="price" placeholder="e.g. 10"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Currency Symbol">
        <sdpi-textfield setting="currencySymbol" placeholder="€" default="€"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Background Color">
        <sdpi-color setting="bgColor" default="#2d3138"></sdpi-color>
    </sdpi-item>
    <sdpi-item label="Text Color">
        <sdpi-color setting="textColor" default="#ffffff"></sdpi-color>
    </sdpi-item>
</body>

</html>
