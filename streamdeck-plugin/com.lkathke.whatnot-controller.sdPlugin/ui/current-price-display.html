<!DOCTYPE html>
<html>

<head lang="en">
    <title>Current Price Display Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Default Price">
        <sdpi-textfield setting="defaultPrice" placeholder="e.g. 1" default="1"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label=" ">
        <span>
            Zeigt den aktuellen Startpreis live an und blinkt kurz rot auf, wenn er sich ändert
            (z.B. durch eine +/- Taste oder einen Preset). Ein Druck auf diese Taste selbst setzt
            den Preis auf den oben eingestellten Standardwert zurück.
        </span>
    </sdpi-item>
</body>

</html>
