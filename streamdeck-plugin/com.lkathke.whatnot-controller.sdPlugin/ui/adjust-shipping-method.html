<!DOCTYPE html>
<html>

<head lang="en">
    <title>Adjust Shipping Method Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Direction">
        <sdpi-select setting="direction" default="next">
            <option value="prev">◀ Vorheriges Profil</option>
            <option value="next">Nächstes Profil ▶</option>
        </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Anwenden auf">
        <sdpi-select setting="target" default="auction">
            <option value="auction">Auktionsartikel</option>
            <option value="giveaway">Giveaway-Artikel</option>
        </sdpi-select>
    </sdpi-item>
    <sdpi-item label=" ">
        <span>
            Springt beim Drücken zum vorherigen/nächsten Versandprofil aus der vollständigen Liste
            deiner echten Profile (mit Umlauf am Ende/Anfang) — angewendet auf den aktuellen
            Auktions- oder Giveaway-Artikel, je nach Auswahl oben.
        </span>
    </sdpi-item>
</body>

</html>
